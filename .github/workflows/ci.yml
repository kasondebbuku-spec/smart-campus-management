name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: smart_campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://campus:campus@localhost:5432/smart_campus_test?schema=public
      TEST_DATABASE_URL: postgresql://campus:campus@localhost:5432/smart_campus_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-longer-than-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
